services:
  backend:
    build: ./backend
    container_name: loan-backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app:z
    user: "${UID}:${GID}"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: loan-frontend
    ports:
      - "8050:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro,z
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      - backend
